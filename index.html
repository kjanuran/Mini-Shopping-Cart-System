<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shopping Cart</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
            <h1 class="text-2xl font-bold text-indigo-600">
                ShopEasy
            </h1>

            <button class="rounded-lg bg-indigo-600 px-4 py-2 text-white">
                Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-6xl px-6 py-10">

        <h2 class="mb-2 text-3xl font-bold text-gray-800">
            Our Products
        </h2>

        <p class="mb-8 text-gray-500">
            Find your favourite products.
        </p>

        <!-- Product Listing -->
        <section id="product-list"
            class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        </section>

        <!-- Shopping Cart -->
        <section class="mt-12 rounded-xl bg-white p-6 shadow-sm">

            <h2 class="mb-6 text-2xl font-bold text-gray-800">
                Your Shopping Cart
            </h2>

            <div id="cart-items">
                <p class="text-gray-500">Your cart is empty.</p>
            </div>

            <div class="mt-6 border-t border-gray-200 pt-4">
                <p class="text-right text-xl font-bold text-gray-800">
                    Total: Rs. <span id="cart-total">0.00</span>
                </p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
